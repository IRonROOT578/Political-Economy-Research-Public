<div class="ballot"><div class="head"><h1>○○年○○選舉　第二輪決選選舉票</h1><div class="meta">選區：○○　3 人決選　選項 1–9　唱票式人工計票　兩段</div></div><p class="notice">請只圈選一格。圈選兩個以上、空白或塗改者，無效。</p><p class="legend">讀法：乙＞甲＞丙＝最喜歡乙，其次甲，最後丙。每一格前面的數字是選項號次，開票時唱這個號次。</p><table class="ids"><tr><th>決選代號</th><td class="tag">甲</td><td class="tag">乙</td><td class="tag">丙</td></tr><tr><th>個人照片</th><td><div class="photo">相片</div></td><td><div class="photo">相片</div></td><td><div class="photo">相片</div></td></tr><tr><th>姓名</th><td class="name">林志明</td><td class="name">Kaliting <wbr>Tjaljaljav</td><td class="name">張家豪</td></tr><tr><th>推薦政黨</th><td class="party">民治黨</td><td class="party">台灣原住民族自治與土地正義聯盟</td><td class="party">綠色未來黨</td></tr></table><p class="sect">完整喜歡順序（選項 1–6）</p><table class="grid"><tr><td class="opt"><span class="mark"></span><span class="onum">1</span>甲＞乙＞丙</td><td class="opt"><span class="mark"></span><span class="onum">2</span>甲＞丙＞乙</td><td class="opt"><span class="mark"></span><span class="onum">3</span>乙＞甲＞丙</td><td class="opt"><span class="mark"></span><span class="onum">4</span>乙＞丙＞甲</td><td class="opt"><span class="mark"></span><span class="onum">5</span>丙＞甲＞乙</td><td class="opt"><span class="mark"></span><span class="onum">6</span>丙＞乙＞甲</td></tr></table><p class="sect">只選一人（選項 7–9）</p><table class="grid"><tr><td class="opt bullet"><span class="mark"></span><span class="onum">7</span>只選甲</td><td class="opt bullet"><span class="mark"></span><span class="onum">8</span>只選乙</td><td class="opt bullet"><span class="mark"></span><span class="onum">9</span>只選丙</td></tr></table><div class="foot"><span>選舉委員會製　樣張</span><span>兩兩對決贏家當選</span></div></div>
